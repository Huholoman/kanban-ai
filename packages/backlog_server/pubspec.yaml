name: backlog_server
description: HTTP server over backlog_core — REST API, live change events over WebSocket and the web app.
version: 0.1.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.8.0

dependencies:
  args: ^2.6.0
  backlog_api:
    path: ../backlog_api
  backlog_core:
    path: ../backlog_core
  path: ^1.9.0
  shelf: ^1.4.2
  shelf_router: ^1.1.4
  shelf_static: ^1.1.3
  shelf_web_socket: ^3.0.0
  watcher: ^1.2.1

dev_dependencies:
  http: ^1.6.0
  lints: ^6.0.0
  test: ^1.25.0
  web_socket_channel: ^3.0.3

executables:
  backlog_server: backlog_server
