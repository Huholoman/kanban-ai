name: backlog_app
description: Board for a file-based backlog — kanban, lists, item details. Talks to backlog_server.
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.8.0
  flutter: ">=3.32.0"

dependencies:
  backlog_api:
    path: ../backlog_api
  flutter:
    sdk: flutter
  flutter_markdown_plus: ^1.0.7
  shared_preferences: ^2.5.3
  url_launcher: ^6.3.2
  web: ^1.1.1

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  shared_preferences_platform_interface: ^2.4.1

flutter:
  uses-material-design: true
  # Bundled so that the web board fetches no fonts from fonts.gstatic.com:
  # Roboto is the engine's default font, BoardSymbols (tool/symbols_font.sh)
  # the theme's fallback for arrows, ticks, shapes and box lines.
  fonts:
    - family: Roboto
      fonts:
        - asset: fonts/Roboto-Regular.ttf
    - family: BoardSymbols
      fonts:
        - asset: fonts/BoardSymbols.ttf
