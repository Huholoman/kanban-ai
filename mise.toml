# Development tools: `mise install`, then `mise run <task>` (`mise tasks` lists them).
# Nix is expected at the system level; the flake builds with the same Flutter version.

[tools]
flutter = "3.32.8" # bundles Dart 3.8.1; matches flutter332 in flake.nix
jq = "1.8.1"       # tool/playground.sh

[tasks.get]
description = "Fetch dependencies of the workspace and the app"
run = ["dart pub get", "cd packages/backlog_app && flutter pub get"]

# The Dart packages and the app are analysed and tested as separate tasks
# (the tests per package), which mise runs in parallel.
[tasks.analyze]
description = "Static analysis of all packages"
depends = ["analyze-dart", "analyze-app"]

[tasks.analyze-dart]
description = "Static analysis of the Dart packages"
run = "dart analyze packages/backlog_core packages/backlog_cli packages/backlog_api packages/backlog_server"

[tasks.analyze-app]
description = "Static analysis of the Flutter app"
dir = "packages/backlog_app"
run = "flutter analyze"

[tasks.test]
description = "All tests"
depends = ["test-dart", "test-app"]

[tasks.test-dart]
description = "Tests of the Dart packages"
depends = ["test-core", "test-cli", "test-api", "test-server"]

[tasks.test-core]
description = "Tests of backlog_core"
depends = ["test-core-pure", "test-core-processes"]

[tasks.test-core-pure]
description = "Tests of backlog_core without the suites tagged processes"
dir = "packages/backlog_core"
run = "dart test -x processes"

[tasks.test-core-processes]
description = "Tests of backlog_core that start real processes, compiled to executables (cheap forks)"
dir = "packages/backlog_core"
run = "dart test --compiler exe test/processes"

[tasks.test-cli]
description = "Tests of backlog_cli"
run = "dart test packages/backlog_cli"

[tasks.test-api]
description = "Tests of backlog_api"
run = "dart test packages/backlog_api"

[tasks.test-server]
description = "Tests of backlog_server"
run = "dart test packages/backlog_server"

[tasks.test-app]
description = "Tests of the Flutter app"
dir = "packages/backlog_app"
run = "flutter test"

[tasks.format]
description = "Format the code (page width 120)"
run = "dart format packages"

[tasks.check]
description = "Format check, analysis and tests — run before committing"
depends = ["format-check", "analyze-dart", "analyze-app", "test-dart", "test-app"]

[tasks.format-check]
description = "Check that the code is formatted"
run = "dart format --output=none --set-exit-if-changed packages"

[tasks.build-web]
description = "Build the web app into packages/backlog_app/build/web (CanvasKit bundled, .br/.gz copies)"
dir = "packages/backlog_app"
run = [
  "flutter build web --release --no-web-resources-cdn --pwa-strategy=none",
  "tool/precompress.sh build/web",
]

[tasks.build]
description = "Compile `kanban-ai` and `kanban-ai-server` into build/ and build the web app, in parallel"
depends = ["build-web", "build-cli", "build-server"]

[tasks.build-cli]
description = "Compile `kanban-ai` into build/"
run = ["mkdir -p build", "dart compile exe packages/backlog_cli/bin/backlog.dart -o build/kanban-ai"]

[tasks.build-server]
description = "Compile `kanban-ai-server` into build/"
run = ["mkdir -p build", "dart compile exe packages/backlog_server/bin/backlog_server.dart -o build/kanban-ai-server"]

[tasks.playground]
description = "(Re)generate playground/ with demo data"
run = [
  "mkdir -p build",
  "dart compile exe packages/backlog_cli/bin/backlog.dart -o build/kanban-ai",
  "KANBAN_AI=$PWD/build/kanban-ai tool/playground.sh",
]

[tasks.serve]
description = "Serve the playground (or KANBAN_AI_DIR) with the built web app"
run = "dart run packages/backlog_server/bin/backlog_server.dart -C ${KANBAN_AI_DIR:-playground/backlog} --web packages/backlog_app/build/web"

[tasks.install]
description = "Install kanban-ai and kanban-ai-server (and their older names backlog, backlog-server) into ~/.local/bin with Nix, from main or the given branch, tag or commit"
usage = 'arg "[ref]" help="Branch, tag or commit of this clone" default="main"'
run = 'tool/install.sh "${usage_ref:-main}"'

[tasks.install-dev]
description = "Install kanban-ai-dev and kanban-ai-server-dev (and backlog-dev, backlog-server-dev) into ~/.local/bin from this worktree (uncommitted changes included): built in parallel with this Flutter and Dart, or with Nix (--nix)"
usage = 'flag "--nix" help="Build with Nix instead"'
run = 'tool/install.sh --dev $([ "${usage_nix:-false}" = true ] && echo --nix)'
